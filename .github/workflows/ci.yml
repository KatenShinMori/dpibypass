name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build, Vet & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build all packages
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .gotmp | Out-Null
          $env:GOTMPDIR = (Resolve-Path .gotmp).Path
          go test -v -count=1 ./...
          Remove-Item -Recurse -Force .gotmp
